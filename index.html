<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aku & Friends Revelación</title>
    <!-- Google Fonts for Modern Typography -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&family=JetBrains+Mono:wght@400;700&family=Creepster&family=Special+Elite&display=swap"
        rel="stylesheet">
    <!-- Enlace a estilos externos -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Efecto de fondo animado -->
    <div class="background-animation"></div>

    <!-- Imágenes laterales -->
    <div class="side-image image-left"></div>
    <div class="side-image image-right"></div>

    <div class="container">
        <header class="title-container">
            <h1 class="horror-title">Aku & Friends</h1>
            <p class="horror-subtitle">LA PURGA: TODO SALE A LA LUZ</p>
        </header>

        <div class="toolbar">
            <div class="status-indicator">
                <span class="pulse-dot"></span>
                <span id="contador" class="contador-text">Inicializando sistema...</span>
            </div>
        </div>

        <div id="muro" class="muro-container">
            <!-- El contenido se cargará vía JS -->
            <div class="loader-container">
                <div class="cyber-loader"></div>
                <div class="status-msg">Desencriptando archivos...</div>
            </div>
        </div>
    </div>

    <!-- Enlace al script externo -->
    <script src="script.js"></script>
</body>

</html>
